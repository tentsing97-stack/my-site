<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тентюков Сергей Глебович</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5f6670;
      --accent: #3b5bdb;
      --accent-soft: #e7ecff;
      --border: #e6e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1c1f25;
        --text: #e9eaec;
        --muted: #a0a6b0;
        --accent: #7c96ff;
        --accent-soft: #252c45;
        --border: #2a2e36;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .wrap { width: 100%; max-width: 640px; }
    header { text-align: center; margin-bottom: 40px; }
    .avatar {
      display: block;
      width: 160px; height: 160px;
      margin: 0 auto 20px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 30%;
      border: 4px solid var(--card);
      box-shadow: 0 6px 24px rgba(0,0,0,.15);
    }
    h1 { font-size: 2.4rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
    .role { color: var(--muted); margin-top: 6px; font-size: 1.1rem; }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 14px;
    }
    p + p { margin-top: 10px; }
    .contacts { list-style: none; display: grid; gap: 10px; }
    .contacts a, .contacts-city {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--text);
      text-decoration: none;
      transition: transform .15s ease;
    }
    .contacts a:hover { transform: translateX(4px); }
    .contacts .label { color: var(--muted); min-width: 90px; font-size: .9rem; }
    footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="avatar" src="photo.jpg" alt="Тентюков Сергей Глебович">
      <h1>Тентюков Сергей Глебович</h1>
      <div class="role">Сыктывкар</div>
    </header>

    <section>
      <h2>Обо мне</h2>
      <p>Здравствуйте! Меня зовут Сергей Глебович Тентюков. Я родился 7&nbsp;ноября 1969&nbsp;года в Сыктывкаре и живу здесь до сих пор.</p>
      <p>У меня есть сын Глеб.</p>
    </section>

    <section>
      <h2>Контакты</h2>
      <ul class="contacts">
        <li><div class="contacts-city"><span class="label">Город</span>Сыктывкар</div></li>
        <li><a href="mailto:smokliza1996@gmail.com"><span class="label">Почта</span>smokliza1996@gmail.com</a></li>
      </ul>
    </section>

    <footer>© 2026 Тентюков Сергей Глебович</footer>
  </div>
</body>
</html>
